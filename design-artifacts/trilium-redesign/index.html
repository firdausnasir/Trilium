    <div class="prototype">
        <aside class="prototype-rail" aria-label="Reference pages">
            <div class="brand"><span class="brand-mark"><svg><use href="#i-mark"></use></svg></span><span><strong>Trilium</strong><small>Knowledge Studio / KS-1</small></span></div>
            <label class="rail-search"><svg><use href="#i-search"></use></svg><span class="sr-only">Filter reference pages</span><input id="global-search" type="search" placeholder="Find surface or state"><kbd>/</kbd></label>
            <nav id="page-nav" class="page-nav"></nav>
            <div class="rail-meta"><span>Reference registry</span><strong id="state-count"></strong></div>
        </aside>
        <main class="prototype-main">
            <header class="prototype-toolbar">
                <div><span class="overline">Implementation reference</span><h1 id="page-title">Workspace</h1></div>
                <div class="toolbar-actions">
                    <div class="view-switch" aria-label="Preview width"><button data-viewport="desktop" class="is-active" aria-label="Desktop preview" aria-pressed="true"><svg><use href="#i-desktop"></use></svg></button><button data-viewport="mobile" aria-label="Mobile preview" aria-pressed="false"><svg><use href="#i-phone"></use></svg></button></div>
                    <button id="theme-toggle" class="button secondary"><svg><use href="#i-sun"></use></svg><span>Dark</span></button>
                </div>
            </header>
            <div class="preview-stage"><div id="preview" class="preview preview-desktop" aria-live="polite"></div></div>
        </main>
    </div>
    <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
    <script src="app.js"></script>

</html>
